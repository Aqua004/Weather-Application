<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METEOROLOGY</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #06b6d4;
            --primary-dark: #0891b2;
            --primary-light: #22d3ee;
            --secondary: #0e7490;
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: rgba(30, 41, 59, 0.8);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent: #06b6d4;
            --shadow: rgba(6, 182, 212, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0e7490 100%);
            background-attachment: fixed;
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(6, 182, 212, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(34, 211, 238, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 20px;
            position: relative;
        }

        .search-section {
            margin-bottom: 40px;
            animation: fadeInDown 0.6s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .search-box {
            position: relative;
            max-width: 600px;
            margin: 0 auto;
        }

        .search-input {
            width: 100%;
            padding: 18px 60px 18px 24px;
            font-family: inherit;
            font-size: 16px;
            border: 2px solid rgba(6, 182, 212, 0.3);
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            color: var(--text-primary);
            border-radius: 50px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .search-input:focus {
            border-color: var(--primary);
            background: rgba(30, 41, 59, 0.8);
            box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.1), 0 10px 30px rgba(6, 182, 212, 0.2);
            transform: translateY(-2px);
        }

        .search-button {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            border: none;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            cursor: pointer;
            font-size: 20px;
            border-radius: 50%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
        }

        .search-button:hover {
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 6px 25px rgba(6, 182, 212, 0.6);
        }

        .search-button:active {
            transform: translateY(-50%) scale(0.95);
        }

        .main-weather {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            margin-bottom: 40px;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .weather-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(6, 182, 212, 0.2);
            padding: 40px;
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .weather-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--primary-light) 100%);
        }

        .weather-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 48px rgba(6, 182, 212, 0.3);
            border-color: rgba(6, 182, 212, 0.4);
        }

        .location-name {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .location-city {
            font-size: 24px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .current-date {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        .temperature {
            font-size: clamp(4rem, 10vw, 6rem);
            font-weight: 700;
            line-height: 1;
            margin: 20px 0;
            color: var(--text-primary);
        }

        .temp-unit {
            font-size: 0.4em;
            font-weight: 400;
            vertical-align: super;
            opacity: 0.7;
        }

        .weather-description {
            font-size: 20px;
            color: var(--primary-light);
            margin-bottom: 30px;
            font-weight: 500;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(6, 182, 212, 0.2);
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            padding: 12px;
            background: rgba(6, 182, 212, 0.05);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .detail-item:hover {
            background: rgba(6, 182, 212, 0.1);
            transform: translateY(-2px);
        }

        .detail-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .detail-value {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .forecast-section {
            margin-top: 40px;
            animation: fadeInUp 1s ease-out;
        }

        .section-title {
            font-size: clamp(1.5rem, 3vw, 2rem);
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--text-primary);
        }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .forecast-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(6, 182, 212, 0.2);
            padding: 24px;
            border-radius: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .forecast-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--primary-light) 100%);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .forecast-card:hover::before {
            transform: scaleX(1);
        }

        .forecast-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 32px rgba(6, 182, 212, 0.3);
            border-color: rgba(6, 182, 212, 0.4);
        }

        .forecast-day {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--primary-light);
        }

        .forecast-icon {
            font-size: 56px;
            margin: 16px 0;
            text-align: center;
        }

        .forecast-temp {
            font-size: 28px;
            font-weight: 700;
            margin: 12px 0;
            color: var(--text-primary);
        }

        .forecast-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .loading {
            text-align: center;
            padding: 100px 20px;
            font-size: 20px;
            color: var(--primary-light);
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        .error {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2) 0%, rgba(220, 38, 38, 0.2) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 30px;
            border-radius: 16px;
            font-size: 18px;
            margin: 20px 0;
            text-align: center;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .main-weather {
                grid-template-columns: 1fr;
            }

            .weather-details {
                grid-template-columns: repeat(2, 1fr);
            }

            .forecast-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 30px 15px;
            }
        }

        /* Smooth scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-light);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="search-section">
            <div class="search-box">
                <input type="text" class="search-input" id="cityInput" placeholder="Search for any city..." value="">
                <button class="search-button" id="searchBtn">→</button>
            </div>
        </div>

        <div id="weatherContent">
            <div class="loading">Loading weather data...</div>
        </div>
    </div>

    <script>
        // Using public Open-Meteo API (free, no API key required)
        const API_BASE = 'https://api.open-meteo.com/v1/forecast';
        const GEOCODING_API = 'https://geocoding-api.open-meteo.com/v1/search';
        const cityInput = document.getElementById('cityInput');
        const searchBtn = document.getElementById('searchBtn');
        const weatherContent = document.getElementById('weatherContent');

        // Geocoding function to find coordinates for any city
        async function geocodeCity(cityName) {
            try {
                const response = await fetch(`${GEOCODING_API}?name=${encodeURIComponent(cityName)}&count=1&language=en&format=json`);

                if (!response.ok) {
                    throw new Error('Geocoding service unavailable');
                }

                const data = await response.json();

                if (!data.results || data.results.length === 0) {
                    throw new Error('City not found');
                }

                const result = data.results[0];
                return {
                    lat: result.latitude,
                    lon: result.longitude,
                    name: result.name,
                    country: result.country,
                    admin1: result.admin1 || ''
                };
            } catch (error) {
                throw error;
            }
        }

        function getWeatherIcon(temp, isDay, windSpeed) {
            if (windSpeed > 50) return '🌪️';
            if (temp > 30) return isDay ? '☀️' : '🌙';
            if (temp > 20) return isDay ? '⛅' : '🌙';
            if (temp > 10) return '☁️';
            if (temp > 0) return '🌧️';
            return '❄️';
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                weekday: 'short',
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        function formatDay(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { weekday: 'short' });
        }

        function getWeatherDescription(temp, windSpeed) {
            if (windSpeed > 50) return 'Very Windy';
            if (temp > 35) return 'Very Hot';
            if (temp > 25) return 'Warm & Pleasant';
            if (temp > 15) return 'Mild';
            if (temp > 5) return 'Cool';
            if (temp > -5) return 'Cold';
            return 'Very Cold';
        }

        async function getWeatherByCoords(lat, lon, cityName, country, admin1) {
            try {
                weatherContent.innerHTML = '<div class="loading">Fetching weather data...</div>';

                // More detailed weather parameters
                const params = new URLSearchParams({
                    latitude: lat,
                    longitude: lon,
                    hourly: 'temperature_2m,relative_humidity_2m,precipitation_probability,precipitation,wind_speed_10m,visibility',
                    current: 'temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,wind_speed_10m,wind_direction_10m,weather_code',
                    daily: 'temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_sum,wind_speed_10m_max',
                    timezone: 'auto'
                });

                const url = `${API_BASE}?${params}`;
                console.log('Fetching from:', url);

                const response = await fetch(url);

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('API Error:', errorText);
                    throw new Error(`API returned status ${response.status}`);
                }

                const data = await response.json();
                console.log('Weather data:', data);

                const locationName = admin1 ? `${cityName}, ${admin1}` : `${cityName}, ${country}`;
                displayWeather(data, locationName);

            } catch (error) {
                console.error('Error details:', error);
                weatherContent.innerHTML = `
                    <div class="error">
                        ⚠ ${error.message}
                    </div>
                    <p style="text-align: center; margin-top: 20px; color: var(--gray);">
                        ${error.message.includes('status') ? 'The weather service returned an error.' : 'Please check your internet connection and try again.'}
                    </p>
                `;
            }
        }

        async function getWeather(city) {
            try {
                weatherContent.innerHTML = '<div class="loading">Searching for location...</div>';

                const location = await geocodeCity(city);
                await getWeatherByCoords(location.lat, location.lon, location.name, location.country, location.admin1);

            } catch (error) {
                weatherContent.innerHTML = `
                    <div class="error">
                        ⚠ ${error.message}
                    </div>
                    <p style="text-align: center; margin-top: 20px; color: var(--gray);">
                        Please try entering the city name differently or check the spelling.
                    </p>
                `;
            }
        }

        function displayWeather(data, cityName) {
            const currentTemp = Math.round(data.current.temperature_2m);
            const feelsLike = Math.round(data.current.apparent_temperature);
            const isDay = data.current.is_day === 1;
            const currentWindSpeed = Math.round(data.current.wind_speed_10m);
            const windDirection = data.current.wind_direction_10m;
            const humidity = data.current.relative_humidity_2m;
            const precipitation = data.current.precipitation;

            // Get daily forecasts
            const dailyData = [];
            for (let i = 0; i < Math.min(5, data.daily.time.length); i++) {
                dailyData.push({
                    date: data.daily.time[i],
                    maxTemp: Math.round(data.daily.temperature_2m_max[i]),
                    minTemp: Math.round(data.daily.temperature_2m_min[i]),
                    precipitation: data.daily.precipitation_sum[i],
                    windSpeed: Math.round(data.daily.wind_speed_10m_max[i]),
                    sunrise: new Date(data.daily.sunrise[i]).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
                    sunset: new Date(data.daily.sunset[i]).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })
                });
            }

            const weatherDesc = getWeatherDescription(currentTemp, currentWindSpeed);

            // Get wind direction
            function getWindDirection(degrees) {
                const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
                const index = Math.round(degrees / 45) % 8;
                return directions[index];
            }

            // Get current hour data for visibility
            const currentHour = new Date().getHours();
            const visibility = data.hourly.visibility ? Math.round(data.hourly.visibility[currentHour] / 1000) : 'N/A';

            weatherContent.innerHTML = `
                <div class="main-weather">
                    <div class="weather-card">
                        <div class="location-name">Current Weather</div>
                        <div class="location-city">${cityName}</div>
                        <div class="current-date">${formatDate(data.daily.time[0])}</div>
                        
                        <div class="temperature">
                            ${currentTemp}<span class="temp-unit">°C</span>
                        </div>
                        
                        <div class="weather-description">${weatherDesc}</div>
                        
                        <div class="weather-details">
                            <div class="detail-item">
                                <div class="detail-label">Feels Like</div>
                                <div class="detail-value">${feelsLike}°C</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Humidity</div>
                                <div class="detail-value">${humidity}%</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Wind</div>
                                <div class="detail-value">${currentWindSpeed} km/h ${getWindDirection(windDirection)}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Precipitation</div>
                                <div class="detail-value">${precipitation} mm</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Visibility</div>
                                <div class="detail-value">${visibility} km</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Sunrise</div>
                                <div class="detail-value">${dailyData[0].sunrise}</div>
                            </div>
                            <div class="detail-item">
                                <div class="detail-label">Sunset</div>
                                <div class="detail-value">${dailyData[0].sunset}</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="forecast-section">
                    <h2 class="section-title">5-Day Forecast</h2>
                    <div class="forecast-grid">
                        ${dailyData.map(day => {
                const avgTemp = Math.round((day.maxTemp + day.minTemp) / 2);
                const dayIcon = getWeatherIcon(avgTemp, true, day.windSpeed);
                return `
                                <div class="forecast-card">
                                    <div class="forecast-day">${formatDay(day.date)}</div>
                                    <div class="forecast-icon">${dayIcon}</div>
                                    <div class="forecast-temp">${day.maxTemp}° / ${day.minTemp}°</div>
                                    <div class="forecast-desc" style="margin-top: 10px;">
                                        <div style="font-size: 11px; margin-bottom: 5px;">💧 ${day.precipitation} mm</div>
                                        <div style="font-size: 11px; margin-bottom: 5px;">💨 ${day.windSpeed} km/h</div>
                                        <div style="font-size: 11px;">🌅 ${day.sunrise}</div>
                                        <div style="font-size: 11px;">🌇 ${day.sunset}</div>
                                    </div>
                                </div>
                            `;
            }).join('')}
                    </div>
                </div>
            `;
        }

        // Event listeners
        searchBtn.addEventListener('click', () => {
            const city = cityInput.value.trim();
            if (city) {
                getWeather(city);
            }
        });

        cityInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const city = cityInput.value.trim();
                if (city) {
                    getWeather(city);
                }
            }
        });

        // Display today's date in header
        function updateHeaderDate() {
            // Function kept for backward compatibility but not used
        }

        // Get user's location and load weather
        function getUserLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;

                        // Reverse geocode to get city name
                        try {
                            const response = await fetch(
                                `https://geocoding-api.open-meteo.com/v1/search?latitude=${lat}&longitude=${lon}&count=1&language=en&format=json`
                            );
                            const data = await response.json();
                            if (data.results && data.results.length > 0) {
                                const location = data.results[0];
                                await getWeatherByCoords(lat, lon, location.name, location.country, location.admin1 || '');
                            } else {
                                // Fallback to Delhi if reverse geocoding fails
                                getWeather('Delhi');
                            }
                        } catch (error) {
                            console.error('Reverse geocoding failed:', error);
                            getWeather('Delhi');
                        }
                    },
                    (error) => {
                        console.log('Geolocation error:', error);
                        // Fallback to Delhi if location access denied
                        getWeather('Delhi');
                    }
                );
            } else {
                // Fallback to Delhi if geolocation not supported
                getWeather('Delhi');
            }
        }

        // Initialize
        getUserLocation();
    </script>
</body>

</html>
